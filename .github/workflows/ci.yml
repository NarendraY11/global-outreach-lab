name: CI
on:
  push:
    branches: [main, feat/**]
  pull_request:
    branches: [main, feat/global-outreach-foundation]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
